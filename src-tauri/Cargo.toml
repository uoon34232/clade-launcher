[package]
name = "clade-launcher"
version = "0.1.0"
description = "Clade Launcher: a portable, vanilla-first Minecraft Java Edition launcher"
authors = ["Clade"]
license = "Apache-2.0"
repository = "https://github.com/uoon34232/clade-launcher"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clade_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
url = "2.5.8"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
zeroize = { version = "1.9.0", features = ["derive", "serde"] }
getrandom = "0.4.3"
socket2 = "0.6.5"
raw-window-handle = "0.6"
tauri-plugin-single-instance = "2.5.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Accessibility"] }
# Read-only OS preference (Transparency effects) through its documented WinRT API; already part of the build through Tauri.
windows = { version = "0.62", features = ["Foundation", "UI_ViewManagement", "Win32_System_WinRT"] }
windows-core = "0.62"
webview2-com = "0.39.1"
wry = "0.57"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep full speed optimization on CPU-bound hashing, decompression, and vault crypto crates.
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.sha1]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
