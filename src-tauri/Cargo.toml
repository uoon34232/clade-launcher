[package]
name = "clade-launcher"
version = "0.1.0"
description = "Clade Launcher: a portable, vanilla-first Minecraft Java Edition launcher"
authors = ["Clade"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clade_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
anyhow = "1.0.104"
url = "2.5.8"
uuid = "1.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
futures = "0.3.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
zip = "8.6.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
getrandom = "0.4.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Globalization"] }
wry = "0.57"
